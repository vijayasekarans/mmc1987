<!DOCTYPE html>
<html lang="en">
<head>
<title>NOSTALGIA 2027 · MMC 87</title>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F8F3E8; --paper:#FFFDF8; --ink:#2A2420; --muted:#6E645B; --line:#E4D9C8;
  --maroon:#8E3526; --maroon-d:#6E2719; --gold:#A8814A; --teal:#1C4644; --gold-l:#E9D9BC; --green:#2F6B4F; --green-l:#E3F0E8;
  --red:#A23A2E; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Source Sans 3',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.55 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--maroon)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.sr{position:absolute;left:-9999px}

/* top bar */
.top{background:var(--teal);color:#fff;border-bottom:6px solid var(--maroon)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
.mono{width:40px;height:50px;border-radius:20px 20px 4px 4px;border:1.5px solid #C29A52;display:grid;place-items:center;
  font:400 18px 'Marcellus',var(--serif);color:#F8F3E8;flex:none}
.top h1{font:400 23px/1.1 'Marcellus',var(--serif);letter-spacing:.1em;margin:0}
.top small{display:block;font-size:14px;color:#CFDAD6;margin-top:3px}

/* save pill */
.pill{position:fixed;right:14px;bottom:14px;z-index:30;background:var(--ink);color:#fff;font-size:15px;
  padding:9px 15px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s}
.pill.on{opacity:1;transform:none}
.pill.ok{background:var(--green)} .pill.err{background:var(--red)}

/* landing */
.hero{background:linear-gradient(180deg,var(--maroon) 0,var(--maroon) 62%,var(--cream) 62%);padding:34px 0 8px;color:#fff}
.hero .eyebrow{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l)}
.hero h2{font:700 54px/1 var(--serif);margin:8px 0 10px;letter-spacing:.02em}
.hero p.lead{font:500 italic 23px/1.35 var(--serif);margin:0 0 26px;color:#F3E7E1;max-width:560px}
.events{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ev{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--shadow);border-top:4px solid var(--gold)}
.ev .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.ev .d{font:700 26px/1.15 var(--serif);color:var(--maroon);margin:4px 0 2px}
.ev .w{font-size:16px;color:var(--muted)}
.ev .n{font-size:15px;margin-top:8px}
section.block{padding:28px 0 6px}
h3.sec{font:700 30px/1.15 var(--serif);color:var(--maroon);margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 16px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.bk b{font:700 22px var(--serif);color:var(--maroon);display:block}
.bk span{font-size:16px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.steps li:before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--maroon);color:#fff;
  display:grid;place-items:center;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 220px}

/* portal home */
.hello{padding:26px 0 8px}
.hello h2{font:700 36px/1.1 var(--serif);margin:0;color:var(--maroon)}
.hello p{margin:6px 0 0;color:var(--muted)}
.bar{height:10px;background:var(--gold-l);border-radius:99px;overflow:hidden;margin:16px 0 4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.barlbl{font-size:15px;color:var(--muted)}
.tiles{display:grid;gap:12px;margin:18px 0 24px}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--gold);transform:translateY(-1px)}
.tile .num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--serif);
  background:var(--cream);color:var(--maroon);border:1.5px solid var(--gold)}
.tile.done .num{background:var(--green);border-color:var(--green);color:#fff}
.tile .t{flex:1}
.tile .t b{display:block;font:700 23px/1.15 var(--serif);color:var(--ink)}
.tile .t span{font-size:16px;color:var(--muted)}
.tile .st{flex:none;font-size:14px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--cream);color:var(--muted);white-space:nowrap}
.tile.done .st{background:var(--green-l);color:var(--green)}
.tile.part .st{background:#F6EAD6;color:#8A5A12}
.tile .chev{flex:none;color:var(--gold);font-size:26px;line-height:1}

/* section view */
.back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 4px;background:none;border:0;color:var(--maroon);
  font-weight:700;font-size:17px;cursor:pointer;padding:8px 0}
.view h2{font:700 36px/1.1 var(--serif);color:var(--maroon);margin:6px 0 4px}
.view .intro{color:var(--muted);margin:0 0 18px}
.q{margin:0 0 22px}
.q > label,.q > .lbl{display:block;font-weight:700;font-size:18px;margin-bottom:6px}
.q .hint{display:block;font-weight:400;font-size:15px;color:var(--muted);margin-top:-2px;margin-bottom:8px}
input[type=text],input[type=email],input[type=tel],input[type=password],textarea{width:100%;padding:14px 15px;background:#fff;border:1.5px solid #D6C9B4;
  border-radius:12px;font-size:18px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,46,46,.12)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.need input,.need textarea{border-color:#D99A7E;background:#FFF8F3}
.count{font-size:14px;color:var(--muted);text-align:right;margin-top:4px}
.count.over{color:var(--red);font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{min-height:50px;padding:10px 18px;border-radius:12px;border:1.5px solid #D6C9B4;background:#fff;cursor:pointer;
  font-size:17px;font-weight:600}
.choices button[aria-pressed=true]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.choices button:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 18px 2px;margin:0 0 18px}
.group h4{font:700 22px var(--serif);color:var(--maroon);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 22px;border-radius:12px;
  border:0;background:var(--maroon);color:#fff;font-weight:700;font-size:18px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--maroon-d)}
.btn.ghost{background:#fff;color:var(--maroon);border:1.5px solid var(--maroon)}
.btn.gold{background:var(--gold)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:10px;font-size:16px;margin-top:8px;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--maroon)}
.note{background:#F6EAD6;border-radius:12px;padding:12px 14px;font-size:16px;color:#6A4510;margin:0 0 18px}
.ok-note{background:var(--green-l);color:var(--green)}

/* portraits */
.portraits{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{position:relative;aspect-ratio:1/1;border-radius:14px;border:2px dashed #CDB894;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;padding:8px;font-size:15px;color:var(--muted)}
.slot b{font-size:16px;color:var(--ink)}
.slot .plus{font-size:34px;color:var(--gold);line-height:1}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;
  font-size:14px;font-weight:700;padding:16px 6px 6px}
.slot.need{border-color:#D99A7E;background:#FFF8F3}
.slot .spin{position:absolute;inset:0;background:rgba(255,253,248,.85);display:grid;place-items:center;font-weight:700;color:var(--maroon)}

/* photo cards */
.pcards{display:grid;gap:14px;margin-top:16px}
.pcard{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.pcard .im{width:150px;height:150px;border-radius:10px;background:#EEE6D8;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:14px;position:relative}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .q{margin-bottom:12px}
.pcard .q > label{font-size:16px}
.pcard input[type=text]{padding:11px 12px;font-size:17px}
.pcard .choices button{min-height:42px;padding:7px 12px;font-size:15px}
.del{background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}
.prog{position:absolute;left:8px;right:8px;bottom:8px;height:6px;background:rgba(255,255,255,.7);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--maroon);width:30%;animation:ind 1.2s infinite ease-in-out}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}

/* list items (stories / tributes) */
.items{display:grid;gap:12px;margin:16px 0}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.item .ty{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.item b{display:block;font:700 22px/1.2 var(--serif);margin:2px 0 4px}
.item p{margin:0 0 10px;color:var(--muted);font-size:16px}
.item .acts{display:flex;gap:18px}
.linkbtn{background:none;border:0;color:var(--maroon);font-weight:700;cursor:pointer;padding:4px 0;font-size:16px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.files span{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:15px}

/* modal + book page preview */
.modal{position:fixed;inset:0;background:rgba(30,20,15,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.sheet{background:var(--cream);border-radius:18px;max-width:640px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.page{background:#FFFDF8;border:1px solid var(--gold);box-shadow:var(--shadow)}
.page .hd{background:var(--maroon);color:#fff;padding:18px 22px}
.page .hd b{display:block;font:700 30px/1.1 var(--serif)}
.page .hd span{color:var(--gold-l);font-size:15px}
.page .pics{display:flex;gap:22px;justify-content:center;padding:18px 16px 4px}
.page .pic{text-align:center;font-size:13px;color:var(--gold);font-weight:700}
.page .pic div{width:128px;height:128px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:#EEE6D8;margin:0 auto 6px}
.page .pic img{width:100%;height:100%;object-fit:cover}
.page .bd{padding:6px 22px 22px}
.page h5{font-size:12px;letter-spacing:.14em;color:var(--maroon);margin:14px 0 4px}
.page p{margin:0;font-size:15px;line-height:1.5}
.page .mem{font:500 italic 18px/1.4 var(--serif);border-left:3px solid var(--gold);padding-left:12px}
.page .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.page .meta span{background:#F4EBDC;border:1px solid var(--gold-l);border-radius:8px;padding:5px 9px;font-size:13px}
.page .fam{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:12px}
.missing{color:var(--red);font-size:16px;margin:10px 0}

.pinbox{max-width:440px;margin:40px auto 0;text-align:center}
.pinbox h2{font:700 34px/1.15 var(--serif);color:var(--maroon);margin:0 0 6px}
.pin{width:100%;max-width:260px;text-align:center;font-size:30px !important;letter-spacing:.5em;padding:14px 10px !important}
.privacy{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:-8px 0 20px;font-size:16px}
.privacy .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cream);display:grid;place-items:center;border:1.5px solid var(--gold);font-size:17px}
.privacy.on .ic{background:var(--green-l);border-color:var(--green)}
.privacy .tx{flex:1 1 180px}
.stepk{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;display:block}
.tile .t .stepk{margin-bottom:1px}
.opt{font-weight:400;color:var(--muted);font-size:15px}
.stepcard{display:grid;gap:8px}
.stepcard.locked .tile{opacity:.55;cursor:not-allowed;transform:none}
.stepcard.locked .num{font-size:18px}
.subtiles{display:grid;gap:8px;margin:0 0 4px 22px;padding-left:16px;border-left:2px solid var(--gold-l)}
.tile.sm{padding:12px 14px;box-shadow:none}
.tile.sm .t b{font-size:20px}
.rank{display:grid;gap:8px;margin:4px 0 10px}
.dest{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid #D6C9B4;border-radius:14px;padding:12px 14px;cursor:pointer;min-height:64px}
.dest .rk{flex:none;width:40px;height:40px;border-radius:50%;border:2px dashed #CDB894;display:grid;place-items:center;font:700 22px var(--serif);color:var(--maroon)}
.dest .dt{flex:1}.dest .dt b{display:block;font-size:18px}.dest .dt span{font-size:15px;color:var(--muted)}
.dest .rl{flex:none;font-size:14px;color:var(--muted);font-weight:600}
.dest.on{border-color:var(--maroon);background:#FBF4F1}.dest.on .rk{background:var(--maroon);border:2px solid var(--maroon);color:#fff}
.dest.on .rl{color:var(--maroon)}
.dest.out{opacity:.5;cursor:not-allowed;text-decoration:line-through}
.foot{color:var(--muted);font-size:15px;text-align:center;padding:30px 0 60px}
.nbtile{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF8,#F6EEDD)}
.nbtile .num{font-size:22px}
.nbme{background:var(--paper);border:1.5px solid var(--gold);border-radius:16px;padding:16px 18px;margin:0 0 16px}
.nbme h4{font:700 21px var(--serif);color:var(--maroon);margin:0 0 8px}
.nbcands{display:grid;gap:10px;margin-top:10px}
.nbcand{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.nbcand img,.nbcand .ph{flex:none;width:52px;height:64px;object-fit:cover;border-radius:6px;background:#EEE6D8}
.nbcand b{flex:1;font-size:17px}
.nbcand .btn{min-height:42px;padding:8px 14px;font-size:15px}
.nbsearch input{width:100%}
.nbres{display:grid;gap:6px;margin:8px 0 14px}
.nbres button.r{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:17px}
.nbres .pg{color:var(--muted);font-size:14px;white-space:nowrap}
.nbres .tag{font-size:12px;font-weight:700;color:var(--green);background:var(--green-l);border-radius:99px;padding:2px 8px;margin-left:6px}
.nbbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.nbbar button{min-height:48px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--maroon);background:#fff;color:var(--maroon);font-weight:700;font-size:16px;cursor:pointer}
.nbbar button[disabled]{opacity:.35;cursor:default}
.nbbar .n{font-weight:700;color:var(--ink);font-size:15px;text-align:center}
.nbpage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:auto;aspect-ratio:595/842;touch-action:pan-y pinch-zoom}
.nbpage img{display:block;width:100%;height:auto}
.nbpage.zoom img{width:200%}
.nbpage.card{aspect-ratio:auto;min-height:220px}
.nbmode{display:flex;gap:0;margin:10px 0 4px;border:1.5px solid var(--maroon);border-radius:12px;overflow:hidden}
.nbmode button{flex:1;min-height:46px;border:0;background:#fff;color:var(--maroon);font-weight:700;font-size:16px;cursor:pointer}
.nbmode button[aria-pressed="true"]{background:var(--maroon);color:#fff}
.nbbar .n small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.nbpage .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.nbmiss{font-size:15px;line-height:1.7;color:var(--ink)}
.wa-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 22px;margin:4px 0 12px;border-radius:999px;background:#25D366;color:#fff !important;font:700 18px var(--sans);text-decoration:none;box-shadow:var(--shadow)}
.wa-btn:hover{background:#1EBE5A}.wa-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wa-btn svg{width:24px;height:24px;flex:none}
.wa-sub{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.foot b{color:var(--ink)}
/* reunion hub */
.months{display:flex;flex-wrap:wrap;gap:8px}
.months button{min-height:50px;padding:10px 16px;border-radius:12px;border:1.5px solid #D6C9B4;background:#fff;cursor:pointer;font-size:17px;font-weight:600}
.months button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.months button[aria-pressed=true]:before{content:"✓ "}
.coming{background:var(--paper);border:1px dashed #CDB894;border-radius:16px;padding:16px 18px;color:var(--muted);font-size:16px}
.coming b{color:var(--ink)}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--cream);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:var(--green-l);color:var(--green);border-color:transparent}
.badge.wait{background:#F6EAD6;color:#8A5A12;border-color:transparent}
.badge.q{background:#FBE9E4;color:var(--red);border-color:transparent}
.fund .amt{font:700 24px var(--serif);color:var(--maroon);margin:2px 0 4px}
.fund .got{font-size:15px;color:var(--green);margin:0 0 8px}
.payhow{display:grid;gap:10px}
.payhow div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.payhow b{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.payhow span{white-space:pre-line;word-break:break-word}
.nownext{background:var(--teal);color:#fff;border-radius:16px;padding:16px 18px;margin:0 0 18px}
.nownext small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);font-weight:700}
.nownext b{display:block;font:700 24px/1.2 var(--serif)}
.nownext span{color:#D6E1DE;font-size:16px}
.nownext + .nownext{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.nownext + .nownext small{color:var(--gold)} .nownext + .nownext span{color:var(--muted)}
.ag-day{font:700 24px var(--serif);color:var(--maroon);margin:22px 0 8px}
.ag{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ag .tm{font-weight:700;color:var(--teal)}
.ag .wh{font-weight:700}
.ag .mt{font-size:15px;color:var(--muted)}
.ag.now{background:var(--green-l);border-radius:10px;padding:12px 10px;border-bottom:0}
.linkcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;margin:0 0 12px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.linkcard .ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--cream);border:1.5px solid var(--gold)}
.linkcard .t{flex:1}.linkcard .t b{display:block;font:700 22px/1.15 var(--serif)}.linkcard .t span{font-size:15px;color:var(--muted)}
.linkcard .chev{color:var(--gold);font-size:26px}
@media (max-width:620px){
  .ag{grid-template-columns:72px 1fr}
  .events,.books{grid-template-columns:1fr}
  .hero h2{font-size:44px}
  .pcard{grid-template-columns:1fr}
  .pcard .im{width:100%;height:220px}
  .portraits{grid-template-columns:repeat(3,1fr);gap:8px}
  .slot{font-size:13px}
  .tile .st{display:none}
}

/* ---------- public landing page ---------- */
.lp-hero .lp-logo{width:96px;height:auto;margin:0 auto 20px;opacity:.95}
.lp-story{max-width:640px;margin:0 auto;padding:52px 0 8px;text-align:center}
.lp-story .lp-h2{margin-bottom:18px}
.lp-story p{font:500 21px/1.6 var(--serif);color:#2C3534;margin:0 0 16px}
.lp-story .lp-sign{font:500 italic 19px var(--serif);color:var(--lp-brick);margin-top:8px}
.lp-story:after{content:"";display:block;width:64px;height:2px;background:var(--lp-brass);margin:30px auto 0}
.toplogo{width:42px;height:42px;object-fit:contain;flex:none}
@media (max-width:760px){.lp-hero .lp-logo{width:80px}.lp-story p{font-size:20px}}

.lp-photo{margin:-30px -28px 24px;position:relative;border-radius:28px 28px 0 0;overflow:hidden;aspect-ratio:16/10;background:#3a2a22}
.lp-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 80%}
.lp-photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:44px 22px 14px;font:500 italic 19px/1.3 var(--serif);color:#FBF6EC;
  background:linear-gradient(to top,rgba(18,48,47,.95),rgba(18,48,47,0))}
.lp-logo{display:block;width:84px;height:84px;object-fit:contain;margin:0 auto 18px}
.toplogo{width:46px;height:46px;object-fit:contain;flex:none}

body.lp-on{background:#F8F3E8}
.lp-hero,.lp-wrap{--lp-ink:#12302F;--lp-teal:#1C4644;--lp-brick:#9A3A2A;--lp-brick-d:#7C2C1F;--lp-brass:#C29A52;--lp-ivory:#F8F3E8;--lp-text:#22302F}
.lp-wrap{max-width:980px;margin:0 auto;padding:0 20px}
.lp-hero{background-color:var(--lp-teal);background-size:cover;background-position:50% 35%;color:var(--lp-ivory);text-align:center;padding:42px 0 54px;position:relative;overflow:hidden}
.lp-hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--lp-brick) 0 46px,var(--lp-brick-d) 46px 48px)}
.lp-arch{width:200px;height:250px;margin:0 auto 22px;border:2px solid var(--lp-brass);background-color:rgba(18,48,47,.55);backdrop-filter:blur(2px);border-radius:100px 100px 6px 6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(194,154,82,.16),transparent 70%);position:relative}
.lp-arch:before{content:"";position:absolute;inset:9px;border:1px solid rgba(194,154,82,.45);border-radius:92px 92px 3px 3px}
.lp-40{font:400 104px/0.9 'Marcellus',var(--serif);color:var(--lp-ivory)}
.lp-yrs{font:500 italic 26px var(--serif);color:var(--lp-brass);margin-top:4px}
.lp-title{font:400 clamp(34px,6vw,54px)/1.05 'Marcellus',var(--serif);letter-spacing:.12em;margin:0;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.lp-batch{font-size:17px;color:#E4ECE9;margin:10px 0 0;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.lp-tag{font:500 italic clamp(21px,3vw,26px)/1.4 var(--serif);color:var(--lp-ivory);max-width:36ch;margin:18px auto 0;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.lp-jump{display:flex;gap:12px;justify-content:center;margin:26px auto 0;max-width:420px}
.lp-jump .lp-btn{margin:0;flex:1.3}
.lp-ghost{flex:1;min-height:58px;border-radius:14px;border:1.5px solid rgba(248,243,232,.6);background:transparent;color:var(--lp-ivory);font:700 19px var(--sans);cursor:pointer}
.lp-ghost:hover{background:rgba(248,243,232,.08)}
.lp-ghost:focus-visible{outline:3px solid var(--lp-brass);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .lp-arch{animation:lpRise .9s cubic-bezier(.2,.7,.2,1) both}
  .lp-40{animation:lpFade 1.1s .35s both}
  @keyframes lpRise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes lpFade{from{opacity:0}to{opacity:1}}
}
.lp-h2{font:400 clamp(28px,4vw,36px)/1.15 'Marcellus',var(--serif);color:var(--lp-ink);margin:0 0 6px}
.lp-lead{color:#4E5B59;margin:0 0 20px;max-width:60ch}
.lp-alert{background:#FBE9E4;color:var(--lp-brick-d);border-radius:10px;padding:12px 14px;margin:24px 0 0}
.lp-plan{padding:46px 0 10px}
.lp-cols{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lp-col{background:#FFFDF8;border:1.5px solid #E2D5BC;border-radius:120px 120px 12px 12px;padding:64px 24px 24px;position:relative;text-align:center}
.lp-col .lp-n{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;
  background:var(--lp-brick);color:#fff;display:grid;place-items:center;font:400 20px 'Marcellus',var(--serif)}
.lp-col h3{font:600 26px/1.15 var(--serif);color:var(--lp-ink);margin:0}
.lp-col .lp-when{color:var(--lp-brick);font-weight:700;font-size:15px;margin:4px 0 12px}
.lp-col p{margin:0 0 10px;font-size:17px;color:var(--lp-text)}
.lp-col .lp-note{color:#6C756F;font-size:15px;margin:0}
.lp-doors{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:40px 0 10px;align-items:start}
.lp-door{border-radius:28px 28px 14px 14px;padding:30px 28px;display:flex;flex-direction:column}
.lp-new .lp-btn{margin-top:auto}
.lp-next{list-style:none;margin:0 0 24px;padding:16px 0 0;border-top:1px solid rgba(248,243,232,.18);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:nx}
.lp-next li{counter-increment:nx;font-size:15px;color:#CFDAD6;position:relative;padding-top:38px}
.lp-next li:before{content:counter(nx);position:absolute;top:0;left:0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--lp-brass);
  color:var(--lp-brass);display:grid;place-items:center;font:400 16px 'Marcellus',var(--serif)}
.lp-next li:not(:last-child):after{content:"";position:absolute;top:15px;left:38px;right:4px;height:1px;background:rgba(194,154,82,.45)}
.lp-next b{display:block;color:var(--lp-ivory);font-size:16px}
.lp-new{background:var(--lp-teal);color:var(--lp-ivory);box-shadow:0 18px 40px -22px rgba(18,48,47,.7)}
.lp-new .lp-h2{color:var(--lp-ivory)} .lp-new .lp-lead{color:#D6E1DE}
.lp-safe{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:12px}
.lp-safe li{padding-left:34px;position:relative;font-size:17px;color:#E9EFEC}
.lp-safe li b{color:#fff}
.lp-safe li:before{content:"✓";position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--lp-brass);color:var(--lp-ink);
  display:grid;place-items:center;font-size:14px;font-weight:700}
.lp-back{background:#FFFDF8;border:1.5px solid #E2D5BC}
.lp-back label:not(.toggle){display:block;font-weight:700;margin:14px 0 6px}
.lp-back input[type=tel],.lp-back input[type=password]{width:100%}
.lp-back .pin{max-width:none;text-align:left;letter-spacing:.35em}
.lp-btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:58px;border:0;border-radius:14px;background:var(--lp-brick);
  color:#fff;font:700 19px var(--sans);cursor:pointer;margin-top:4px}
.lp-btn:hover{background:var(--lp-brick-d)}
.lp-btn:focus-visible,.lp-back input:focus-visible{outline:3px solid var(--lp-brass);outline-offset:2px}
.lp-btn2{background:var(--lp-ink)} .lp-btn2:hover{background:#0B2120}
.lp-back .linkbtn{margin-top:12px;color:var(--lp-brick)}
.lp-foot{text-align:center;color:#5D6866;font-size:15px;padding:34px 0 50px}
.lp-foot a{color:var(--lp-brick);font-weight:700}
@media (max-width:760px){
  .lp-cols{grid-template-columns:1fr;gap:14px}
  .lp-col{border-radius:90px 90px 12px 12px;padding-top:60px}
  .lp-doors{grid-template-columns:1fr}
  .lp-arch{width:160px;height:200px}
  .lp-40{font-size:82px}
}
</style>
</head>

let KEY = BOOT.key || '';
let AUTH = BOOT.mode === 'portal' ? KEY : '';
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } }
};
const S = { data: BOOT.data || null, status: null, view: 'home', thumbs: {}, saving: {}, timers: {} };

/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words = t => (String(t || '').match(/\S+/g) || []).length;
const first = () => S.data.person.college || (S.data.bookone && S.data.bookone.nickname) || S.data.person.name.replace(/^Dr\.?\s+/i, '').split(' ')[0];

function run(fn, ...args) {
  return new Promise((ok, bad) => {
    const fail = e => {
      const err = e && e.message ? e : new Error(String(e));
      if (/PIN_REQUIRED/.test(err.message)) { lockScreen(true); return bad(new Error('Please enter your PIN again.')); }
      bad(err);
    };
    fetch(window.__API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                          body: JSON.stringify({ fn, args }) })
      .then(r => r.json())
      .then(j => j.ok ? ok(j.result) : fail(new Error(j.error || 'Something went wrong')))
      .catch(() => fail(new Error('Network problem. Please check your connection and try again.')));
  });
}
let pillT;
function pill(msg, kind = '', ms = 1800) {
  const p = $('#pill'); p.textContent = msg; p.className = 'pill on ' + kind;
  clearTimeout(pillT); if (ms) pillT = setTimeout(() => p.className = 'pill', ms);
}
function choice(sec, f, opts, val) {
  return `<div class="choices" role="radiogroup">${opts.map(o =>
    `<button type="button" data-sec="${sec}" data-f="${f}" data-v="${esc(o)}" aria-pressed="${String(val) === String(o)}">${esc(o)}</button>`).join('')}</div>`;
}
function text(sec, f, label, val, o = {}) {
  const tag = o.area ? 'textarea' : 'input';
  const need = o.need && !val ? ' need' : '';
  const lim = o.limit ? `<div class="count" data-count="${sec}.${f}" data-limit="${o.limit}">${words(val)} / ${o.limit} words</div>` : '';
  const input = o.area
    ? `<textarea id="${sec}-${f}" data-sec="${sec}" data-f="${f}" placeholder="${esc(o.ph || '')}">${esc(val)}</textarea>`
    : `<input id="${sec}-${f}" type="${o.type || 'text'}" data-sec="${sec}" data-f="${f}" value="${esc(val)}" placeholder="${esc(o.ph || '')}" autocomplete="off">`;
  return `<div class="q${need}"><label for="${sec}-${f}">${esc(label)}${o.req ? ' <span style="color:var(--red)">*</span>' : ''}</label>${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}${input}${lim}</div>`;
}

  $('#siForgot').onclick = async () => {

const BOOK_SECTIONS = [
  { id: 'bookone', title: 'My page in Book One', sub: 'Photos, your story, a memory' },
  { id: 'photos', title: 'Photos for Book Two', sub: 'College, reunions, trips' },
  { id: 'stories', title: 'Stories, poems & art', sub: 'Anything you’d like to share' },
  { id: 'tributes', title: 'Tributes', sub: 'Teachers and friends we have lost' }
];
const HUB_SECTIONS = [
  { id: 'travel', title: 'Travel & attendance details', sub: 'Who’s coming with you, food, rooms, flights' },
  { id: 'funds', title: 'Contributions', sub: 'What to pay, how to pay, and what we’ve received' },
  { id: 'agenda', title: 'Agenda', sub: 'Day by day, with what’s on now' },
  { id: 'chat', title: 'Chat on WhatsApp', sub: 'Announcements and group chats' },
  { id: 'eventphotos', title: 'Reunion photos', sub: 'Shared albums for the meet and the trip' }
];
const SECTIONS = [{ id: 'poll', title: 'Dates & destination' }, { id: 'nb', title: 'NOSTALGIA 1993' }].concat(BOOK_SECTIONS, HUB_SECTIONS);
const hub = () => (S.data && S.data.hub) || { show: {}, going: {}, info: {} };
const hubOn = () => HUB_SECTIONS.filter(s => hub().show[s.id]);
const REQ1 = ['printName', 'specialty', 'city', 'life', 'memory', 'photoThen', 'photoNow'];
const step1Done = () => !!(S.data && S.data.person.name && S.data.person.whatsapp && S.data.person.hasPin && S.data.person.email && S.data.person.address && S.data.person.city);
const step2Done = () => !!(S.data && S.data.poll.meet && S.data.poll.trip);

function travelNeed() {
  const g = hub().going || {};
  return (g.meet ? ['food'] : []).concat(g.trip ? ['passportName', 'nationality', 'emergencyName', 'emergencyPhone'] : []);
}
function statusOf(id) {
  const d = S.data;
  if (id === 'travel') {
    const t = hub().travel || {}, need = travelNeed();
    if (!need.length) return { cls: '', txt: 'Not needed' };
    const n = need.filter(f => t[f]).length;
    return n === need.length ? { cls: 'done', txt: 'Done' } : { cls: n ? 'part' : '', txt: n ? `${n} of ${need.length} done` : 'To do' };
  }
  if (id === 'funds') {
    const m = (hub().funds && hub().funds.mine) || [];
    if (!m.length) return { cls: '', txt: 'Not paid yet' };
    const ok = m.filter(x => x.status === 'Received').length;
    return ok === m.length ? { cls: 'done', txt: `${ok} confirmed` } : { cls: 'part', txt: `${m.length - ok} waiting` };
  }
  if (id === 'agenda') {
    const it = ((hub().agenda && hub().agenda.items) || []).find(x => x.now);
    return it ? { cls: 'part', txt: 'On now' } : { cls: '', txt: 'View' };
  }
  if (id === 'chat' || id === 'eventphotos') return { cls: '', txt: 'Open' };
  if (id === 'bookone') {
    const n = REQ1.filter(f => d.bookone[f]).length;
    if (d.bookone.approved === 'Yes') return { cls: 'done', txt: 'Approved' };
    if (n === REQ1.length) return { cls: 'done', txt: 'Ready to approve' };
    return { cls: n ? 'part' : '', txt: n ? `${n} of ${REQ1.length} done` : 'Not started' };
  }
  const n = d[id].length;
  const unit = id === 'photos' ? 'photo' : id === 'stories' ? 'piece' : 'tribute';
  return n ? { cls: 'done', txt: `${n} ${unit}${n > 1 ? 's' : ''}` } : { cls: '', txt: id === 'tributes' ? 'Optional' : 'None yet' };
}

function stepCard(n, title, sub, state, go, extra = '') {
  const done = state === 'done', locked = state === 'locked';
  return `<div class="stepcard ${state}">
    <button class="tile ${done ? 'done' : ''}" ${locked ? 'disabled aria-disabled="true"' : `data-go="${go}"`}>
      <span class="num">${done ? '✓' : locked ? '🔒' : n}</span>
      <span class="t"><small class="stepk">Step ${n}</small><b>${esc(title)}</b><span>${esc(sub)}</span></span>
      <span class="st">${done ? 'Done' : locked ? 'Opens after step ' + (n - 1) : 'To do'}</span>${locked ? '' : '<span class="chev">›</span>'}
    </button>${extra}</div>`;
}

function home() {
  S.view = 'home';
  const d = S.data, s1 = step1Done(), s2 = step2Done();
  const booksDone = REQ1.filter(f => d.bookone[f]).length / REQ1.length * .7 + (d.photos.length ? .15 : 0) + (d.stories.length ? .15 : 0);

  const p = d.poll;
  const pollSub = s2 ? `Meet: ${p.meet} · Trip: ${p.trip}${p.ranking[0] ? ' · 1st choice: ' + p.ranking[0] : ''}` : `Will you come? Rank the destinations.${C.POLL_DEADLINE ? ' By ' + C.POLL_DEADLINE + '.' : ''}`;
  const books = s2 ? `<div class="subtiles" id="subBooks">${BOOK_SECTIONS.map(s => { const st = statusOf(s.id); return `
      <button class="tile sm ${st.cls}" data-go="${s.id}"><span class="t"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></span>
        <span class="st">${esc(st.txt)}</span><span class="chev">›</span></button>`; }).join('')}</div>` : '';
  $('#app').innerHTML = topbar() + `<div class="wrap">
    <div class="hello">
      <h2>Welcome, ${esc(first())}.</h2>
      <p>Only you and the organising committee can see what you add here.</p>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>

    </div>

    ${C.LOCKED ? `<div class="note">Submissions are now closed while the books are being designed. You can still look at everything you sent.</div>` : ''}
    <div class="tiles">
      ${stepCard(1, 'About you', s1 ? [d.person.name, d.person.whatsapp].filter(Boolean).join(' · ') : 'Name, mobile, PIN', s1 ? 'done' : 'todo', 'step1')}
      ${stepCard(2, 'Dates & destination poll', pollSub, s2 ? 'done' : (s1 ? 'todo' : 'locked'), 'poll')}
      ${stepCard(3, 'For the commemorative books', s2 ? `Add these any time until ${C.DEADLINE}` : 'Book One page, photos, stories, tributes', s2 ? (booksDone >= .99 ? 'done' : 'todo') : 'locked', 'books', books)}
      ${s2 ? hubCard() : ''}
      ${s1 ? `<button class="tile nbtile" data-go="nb"><span class="num" aria-hidden="true">📖</span><span class="t"><small class="stepk">1993 · Our graduation book</small><b>Flip through NOSTALGIA 1993</b><span>Find yourself and old friends, page by page</span></span><span class="chev">›</span></button>` : ''}
    </div>
    ${s1 ? `<div class="privacy on"><span class="ic" aria-hidden="true">🔒</span><span class="tx"><b>Your page is protected with your PIN.</b></span>
      <button class="linkbtn" id="chgPin">Change PIN</button><button class="linkbtn" style="color:var(--muted)" id="signOut">Sign out</button></div>` : ''}
    ${footer()}
  </div>`;
  if (BOOT.pinReset) S.resetShown = true;
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const g = b.dataset.go;
    if (g === 'step1') return openStep1();
    if (g === 'books') return $('#subBooks') && $('#subBooks').scrollIntoView({ behavior: 'smooth' });
    if (g === 'hub') return $('#subHub') && $('#subHub').scrollIntoView({ behavior: 'smooth' });
    open(g);
  });
  const cp = $('#chgPin'); if (cp) cp.onclick = () => pinModal();
  const so = $('#signOut'); if (so) so.onclick = () => {
    LS.set('n27dev_' + KEY, null); LS.set('n27key', null);
    AUTH = ''; S.data = null; BOOT.mode = 'landing'; landing(); window.scrollTo(0, 0);
  };
  window.scrollTo(0, 0);
}

function topbar() {
  return `<div class="top"><div class="wrap">${MMC_LOGO ? `<img class="toplogo" src="${MMC_LOGO}" alt="Madras Medical College emblem">` : '<div class="mono">87</div>'}<div><h1>${esc(C.TITLE)}</h1><small>${esc(C.BATCH)}, 40 years on</small></div></div></div>`;
}

function open(id) {
  if (id !== 'step1' && !step1Done()) return openStep1();
  if (BOOK_SECTIONS.concat(HUB_SECTIONS).some(s => s.id === id) && !step2Done()) { pill('Please finish Step 2 first', '', 2500); return open('poll'); }
  if (HUB_SECTIONS.some(s => s.id === id) && !hub().show[id]) return home();
  S.view = id;
  const sec = SECTIONS.find(s => s.id === id);

     nb: bindNb, funds: bindFunds, agenda: bindAgenda })[id]?.();

}

  document.body.classList.remove('lp-on');
  S.view = 'step1';
  const p = (S.data && S.data.person) || { name: '', college: '', whatsapp: '', email: '', address: '', city: '', hasPin: false };

  const needPin = isNew || !p.hasPin;
  const f = (id, label, val, o = {}) => `<div class="q"><label for="s1-${id}">${esc(label)}${o.req ? ' <span style="color:var(--red)">*</span>' : ' <span class="opt">(optional)</span>'}</label>
    ${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}

      ${f('college', 'What we called you in college', p.college, { ph: 'e.g. Anju' })}
      ${f('whatsapp', 'Mobile / WhatsApp number', p.whatsapp, { req: 1, type: 'tel', ph: '+91 98400 12345', hint: 'With country code. You’ll use this number to sign in.', ac: 'tel' })}
      ${f('email', 'Email', p.email, { req: 1, type: 'email', ph: 'you@example.com', hint: 'For reunion updates, and to reset your PIN if you ever forget it.', ac: 'email' })}
      ${f('address', 'Postal address', p.address, { req: 1, area: 1, ph: 'House, street, city, PIN / ZIP code', hint: 'Only if you’d like a printed book or invitation posted to you. (Needed so we can post the books.)' })}
      ${f('city', 'City & country', p.city, { req: 1, ph: 'e.g. Chennai, India' })}
    </div>
    <div class="group"><h4>${needPin ? 'Choose your PIN' : 'Your PIN'}</h4>
      ${needPin ? `<p class="hint" style="margin:-6px 0 12px;color:var(--muted);font-size:15px">4 to 6 digits that you’ll remember. With your mobile number, it lets you come back to your page, and keeps it private.</p>
        <div class="row"><div class="q"><label for="pin1">PIN <span style="color:var(--red)">*</span></label><input id="pin1" class="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" style="max-width:none"></div>
        <div class="q"><label for="pin2">Type it again <span style="color:var(--red)">*</span></label><input id="pin2" class="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" style="max-width:none"></div></div>
        <label class="toggle" style="margin:-6px 0 18px"><input type="checkbox" id="pinRem" checked> Remember this phone or computer for ${C.REMEMBER_DAYS} days</label>`
      : `<p style="margin:0 0 18px">🔒 Your PIN is set. <button class="linkbtn" id="s1chg">Change PIN</button></p>`}
    </div>
    <p id="s1msg" class="missing" aria-live="polite"></p>
    <button class="btn wide" id="s1save">${isNew ? 'Save and continue to Step 2' : 'Save'}</button>
    </div>${footer()}</div>`;
  document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => home());
  const bk = $('#s1back'); if (bk) bk.onclick = () => landing();
  const ch = $('#s1chg'); if (ch) ch.onclick = () => pinModal();
  ['pin1', 'pin2'].forEach(id => { const el = $('#' + id); if (el) el.oninput = () => el.value = el.value.replace(/\D/g, '').slice(0, 6); });

    const info = { name: v('name'), college: v('college'), whatsapp: v('whatsapp'), email: v('email'), address: v('address'), city: v('city') };

    if (info.whatsapp.replace(/\D/g, '').length < 8) { msg.textContent = 'Please enter your mobile number with country code.'; $('#s1-whatsapp').focus(); return; }
    if (!info.address) { msg.textContent = 'Please enter your postal address.'; $('#s1-address').focus(); return; } if (!info.city) { msg.textContent = 'Please enter your city and country.'; $('#s1-city').focus(); return; } if (!/^\S+@\S+\.\S+$/.test(info.email)) { msg.textContent = 'That email doesn’t look right. Please enter a valid email address.'; $('#s1-email').focus(); return; }

    msg.textContent = ''; $('#s1save').disabled = true; pill('Saving…', '', 0);

      if (isNew) {
        const r = await run('register', info, pin, rem);

      if (!S.data.bookone.phone && info.whatsapp) S.data.bookone.phone = info.whatsapp;
      if (!S.data.bookone.city && info.city) S.data.bookone.city = info.city;
      pill('Saved ✓', 'ok');
      step2Done() ? home() : open('poll');
    } catch (e) { msg.textContent = e.message; pill(e.message, 'err', 5000); $('#s1save').disabled = false; }
  };
  window.scrollTo(0, 0);
}

function bindPoll() {
  const p = S.draftPoll;
  const ord = n => ['1st', '2nd', '3rd', '4th', '5th', '6th'][n] || (n + 1) + 'th';
  const draw = () => {
    p.ranking = p.ranking.filter(n => !p.notGo.includes(n));
    $('#rank').innerHTML = C.DESTINATIONS.map(d => {
      const i = p.ranking.indexOf(d.name), out = p.notGo.includes(d.name);
      return `<button type="button" class="dest ${i > -1 ? 'on' : ''} ${out ? 'out' : ''}" data-dest="${esc(d.name)}" ${out ? 'disabled' : ''} aria-pressed="${i > -1}">
        <span class="rk">${out ? '✕' : i > -1 ? i + 1 : ''}</span>
        <span class="dt"><b>${esc(d.name)}</b><span>${d.when ? esc(d.when) + ' · ' : ''}${esc(d.cost)}</span></span>
        <span class="rl">${out ? 'Won’t go' : i > -1 ? ord(i) + ' choice' : 'Tap to rank'}</span></button>`;
    }).join('');
    document.querySelectorAll('[data-dest]').forEach(b => b.onclick = () => {
      const n = b.dataset.dest, i = p.ranking.indexOf(n);
      if (i > -1) p.ranking.splice(i, 1); else p.ranking.push(n);
      draw();
    });
  };
  draw();
  $('#rankClear').onclick = () => { p.ranking = []; draw(); };
  document.querySelectorAll('[data-notgo]').forEach(c => c.onchange = () => {
    const n = c.dataset.notgo;
    p.notGo = c.checked ? p.notGo.concat(n) : p.notGo.filter(x => x !== n);
    draw();
  });
  p.months = p.months || [];
  document.querySelectorAll('[data-month]').forEach(b => b.onclick = () => {
    const m = b.dataset.month;
    p.months = p.months.includes(m) ? p.months.filter(x => x !== m) : p.months.concat(m);
    b.setAttribute('aria-pressed', String(p.months.includes(m)));
  });
  document.querySelectorAll('[data-sec="poll"]').forEach(b => b.onclick = () => {
    p[b.dataset.f] = b.dataset.v;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('#pollSave').onclick = async () => {
    const msg = $('#pollMsg');
    p.comments = $('#pollC').value.trim();
    if (!p.meet) { msg.textContent = 'Please answer question 1: will you come to the Chennai meet?'; return; }
    if (!p.trip) { msg.textContent = 'Please answer question 2: will you join the trip?'; return; }
    if ((p.meet !== 'No' || p.trip !== 'No') && !p.months.length) { msg.textContent = 'Please answer question 3: tick at least one month that suits you.'; return; }
    const rankable = C.DESTINATIONS.filter(d => !p.notGo.includes(d.name)).length;
    if (p.trip !== 'No' && p.ranking.length < rankable && !confirm('You haven’t ranked every destination. Submit anyway?')) return;
    msg.textContent = ''; $('#pollSave').disabled = true; pill('Saving…', '', 0);
    const firstTime = !step2Done();
    try {
      await run('savePoll', AUTH, { meet: p.meet, trip: p.trip, months: p.months, ranking: p.ranking, notGo: p.notGo, comments: p.comments });
      S.data.poll = p;
      if (S.data.hub) S.data.hub.going = { meet: p.meet !== 'No', trip: p.trip !== 'No' };
      pill(firstTime ? 'Thank you! Step 3 is now open ✓' : 'Answers updated ✓', 'ok', 3500);
      home();
    } catch (e) { msg.textContent = e.message; pill(e.message, 'err', 5000); $('#pollSave').disabled = false; }
  };
}

function pcard(p) {

    </div></div>`;
}
function bindPhotos() {
  const fi = $('#photoFiles');
  $('#addPhotos').onclick = () => { fi.value = ''; fi.click(); };
  fi.onchange = () => {
    const files = Array.from(fi.files || []);
    files.forEach(async file => {
      const tmp = 'tmp' + Math.random().toString(36).slice(2);
      const p = { tmp, local: URL.createObjectURL(file), uploading: true, event: '', year: '', place: '', people: '', caption: '' };
      S.data.photos.push(p);
      $('#pcards').insertAdjacentHTML('afterbegin', pcard(p));
      bindPhotoCard($(`[data-pid="${tmp}"]`), p);
      queue(async () => {
        try {
          const res = await upload(file, 'photo');
          p.id = res.id; p.uploading = false;
          S.thumbs[p.id] = await toDataUrl(file, 500);
          const el = $(`[data-pid="${tmp}"]`);
          if (el) { el.outerHTML = pcard(p); bindPhotoCard($(`[data-pid="${p.id}"]`), p); }
          if (p.event || p.year || p.place || p.people || p.caption) savePhoto(p);
          pill('Photo saved ✓', 'ok');
        } catch (e) {
          S.data.photos = S.data.photos.filter(x => x !== p);
          const el = $(`[data-pid="${tmp}"]`); if (el) el.remove();
          pill(e.message, 'err', 6000);
        }
      });
    });
  };
  S.data.photos.forEach(p => bindPhotoCard($(`[data-pid="${p.id || p.tmp}"]`), p));
  loadThumbs(S.data.photos.map(p => p.id).filter(id => id && !S.thumbs[id]), ids => ids.forEach(id => {
    const el = $(`[data-pid="${id}"] .im`); if (el && S.thumbs[id]) el.innerHTML = `<img src="${S.thumbs[id]}" alt="">`;
  }));
}
function bindPhotoCard(el, p) {
  if (!el) return;
  el.querySelectorAll('[data-sec="photo"]').forEach(b => b.onclick = () => {
    if (C.LOCKED) return;
    p.event = b.dataset.v;
    el.querySelectorAll('[data-sec="photo"]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    savePhoto(p);
  });
  el.querySelectorAll('[data-photo]').forEach(inp => inp.oninput = () => { p[inp.dataset.photo] = inp.value; debounce('ph' + (p.id || p.tmp), () => savePhoto(p), 1200); });
  const del = el.querySelector('[data-delphoto]');
  if (del) del.onclick = async () => {
    if (!confirm('Remove this photo?')) return;
    try { await run('deletePhoto', AUTH, p.id); S.data.photos = S.data.photos.filter(x => x !== p); el.remove(); pill('Photo removed', 'ok'); }
    catch (e) { pill(e.message, 'err', 5000); }
  };
}
async function savePhoto(p) {
  if (!p.id || C.LOCKED) return;
  pill('Saving…', '', 0);
  try { await run('updatePhoto', AUTH, p.id, { event: p.event, year: p.year, place: p.place, people: p.people, caption: p.caption }); pill('Saved ✓', 'ok'); }
  catch (e) { pill(e.message, 'err', 5000); }
}

function bindFunds() {

/* ---------- Agenda ---------- */
function viewAgenda() {
  const A = hub().agenda || { items: [] };
  if (!A.items.length) return `<p class="intro">The committee is still putting the agenda together. Please check back soon.</p>`;
  const cur = A.items.find(x => x.now), nxt = A.items.find(x => x.next);
  const line = x => [x.start + (x.end ? '–' + x.end : ''), x.where].filter(Boolean).join(' · ');
  let h = `<p class="intro">Times are local time (${esc(A.tz)}). Updated ${esc(A.asOf)}. <button class="linkbtn" id="agRefresh">Refresh</button></p>`;
  if (cur) h += `<div class="nownext"><small>On now</small><b>${esc(cur.what)}</b><span>${esc(line(cur))}</span></div>`;
  if (nxt) h += `<div class="nownext"><small>Next${nxt.date ? ' · ' + esc(nxt.day) : ''}</small><b>${esc(nxt.what)}</b><span>${esc(line(nxt))}</span></div>`;
  let day = null;
  A.items.forEach(x => {
    if (x.day !== day) { day = x.day; h += `<div class="ag-day">${esc(day)}</div>`; }
    h += `<div class="ag ${x.now ? 'now' : ''}"><div class="tm">${esc(x.start || '')}${x.end ? `<br><span class="mt">to ${esc(x.end)}</span>` : ''}</div>
      <div><div class="wh">${esc(x.what)}${x.who && !/^all/i.test(x.who) ? ` <span class="badge">${esc(x.who)}</span>` : ''}</div>
      ${x.where ? `<div class="mt">📍 ${esc(x.where)}</div>` : ''}${x.notes ? `<div class="mt">${esc(x.notes)}</div>` : ''}</div></div>`;
  });
  return h;
}

/* ---------- Chat & photos ---------- */
function linkCard(icon, title, sub, url) {
  return `<a class="linkcard" href="${esc(url)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">${icon}</span>
    <span class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></span><span class="chev">›</span></a>`;
}
function viewChat() {
  const L = hub().chat || [];
  return `<p class="intro">Our day-to-day chat happens on WhatsApp. Tap a group to join it.</p>
    ${L.map(c => linkCard('💬', c.label, c.sub, c.url)).join('') || '<p class="sub">The group links will appear here soon.</p>'}
    <div class="note">Please also add your photos to the shared albums (in “Reunion photos”), so they’re kept safely after the chat scrolls away.</div>`;
}
function viewEventPhotos() {
  const L = hub().albums || [];
  return `<p class="intro">Shared Google Photos albums. Anyone in the batch can look, and add their own photos and videos from their phone.</p>
    ${L.map(a => linkCard('📷', a.label, 'Open the album, then tap “+” or “Add photos”', a.url)).join('') || '<p class="sub">The album links will appear here soon.</p>'}
    <div class="note">Tip: add the original photos from your phone’s gallery rather than ones forwarded on WhatsApp. They stay sharp enough to print.</div>
    ${!C.LOCKED ? `<button class="btn ghost wide" data-go2="photos">Add old photos for Book Two instead</button>` : ''}`;
}


/* =========================================================
   NOSTALGIA 1993: our graduation book (signed-in classmates only)
   ========================================================= */
const nbName = n => String(n || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/^(\S+)\.\s/, '$1 ').replace(/\s+/g, ' ').trim();
const nbFirst = n => String(n || '').split(/[.\s]/)[0].toLowerCase();
function viewNb() {
  return `<p class="intro">Our graduation book from 1993, page by page. Home addresses, phone numbers and birth years have been hidden.</p>
  <div id="nbMe"></div>
  <div class="q nbsearch"><label for="nbQ">Find a classmate</label><input id="nbQ" type="text" placeholder="Type a name, e.g. Karpagam" autocomplete="off"></div>
  <div class="nbres" id="nbRes"></div>
  <div class="nbmode" id="nbMode" hidden><button type="button" data-m="card" aria-pressed="true">One person</button><button type="button" data-m="page" aria-pressed="false">Book pages</button></div>
  <div class="nbbar"><button id="nbPrev" type="button">‹ Prev</button><span class="n" id="nbNum"></span><button id="nbNext" type="button">Next ›</button></div>
  <div class="nbpage" id="nbPage"><div class="ld">Opening the book…</div></div>
  <div class="nbbar"><button id="nbPrev2" type="button">‹ Prev</button><button id="nbZoom" type="button">🔍 Zoom</button><button id="nbNext2" type="button">Next ›</button></div>
  <div class="group" style="margin-top:18px"><h4>Help us find our classmates</h4><p class="hint" id="nbMissN" style="margin:-6px 0 10px;color:var(--muted);font-size:15px"></p><details><summary style="cursor:pointer;font-weight:700;color:var(--maroon);margin-bottom:8px">Show the names</summary><div class="nbmiss" id="nbMiss"></div></details><div style="height:16px"></div></div>`;
}
async function bindNb() {
  S.nbImg = S.nbImg || {};
  let info;
  try { info = S.nbInfo = await run('nbInfo', AUTH); } catch (e) { $('#nbPage').innerHTML = `<div class="ld">${esc(e.message)}</div>`; return; }
  if (!info.installed) {
    $('#nbPage').innerHTML = '<div class="ld">The 1993 book will appear here very soon.</div>';
    ['nbPrev', 'nbNext', 'nbPrev2', 'nbNext2', 'nbZoom'].forEach(id => $('#' + id).disabled = true);
  }
  const byId = {}, cardOf = {}; info.index.forEach((e, i) => { byId[e[0]] = e; cardOf[e[0]] = i + 2; });
  const mineE = () => info.mine && byId[info.mine];
  let mode = info.cards ? (S.nbMode || (() => { try { return localStorage.getItem('nbMode'); } catch (e) { return null; } })() || 'card') : 'page';
  if (mode === 'card' && !info.cards) mode = 'page';
  const max = () => mode === 'card' ? info.cards : info.pages;
  const lastCard = () => info.cards || info.index.length + 2;
  // where a given entry lives in the current view
  const posOf = id => mode === 'card' ? cardOf[id] : byId[id][1];
  // convert a position between the two views
  const toPage = c => c <= 1 ? 1 : c >= lastCard() ? info.pages : info.index[c - 2][1];
  const toCard = pg => pg <= 1 ? 1 : pg >= info.pages ? lastCard() : (cardOf[(info.index.find(e => e[1] === pg) || [])[0]] || 1);
  let page = S.nbPos && S.nbPosMode === mode ? S.nbPos : (mineE() ? posOf(info.mine) : 1);
  const label = n => {
    if (mode === 'page') { const names = info.index.filter(e => e[1] === n).map(e => nbName(e[2])).join(' and '); return [`Page ${n} of ${info.pages}`, names]; }
    if (n === 1) return ['The cover', ''];
    if (n >= lastCard()) return ['The last page', ''];
    const e = info.index[n - 2]; return [nbName(e[2]), `${n - 1} of ${info.index.length} · page ${e[1]}`];
  };
  const key = n => (mode === 'card' ? 'c' : 'p') + n;
  const fetchImg = n => { const k = key(n); return S.nbImg[k] ? Promise.resolve(S.nbImg[k]) : run('nbPage', AUTH, n, mode).then(u => (S.nbImg[k] = u)); };
  const show = async n => {
    if (!info.installed) return;
    page = S.nbPos = Math.max(1, Math.min(max(), n)); S.nbPosMode = mode;
    const [l1, l2] = label(page);
    $('#nbNum').innerHTML = esc(l1) + (l2 ? `<small>${esc(l2)}</small>` : '');
    ['nbPrev', 'nbPrev2'].forEach(id => $('#' + id).disabled = page <= 1);
    ['nbNext', 'nbNext2'].forEach(id => $('#' + id).disabled = page >= max());
    const box = $('#nbPage'); if (!box) return;
    box.classList.toggle('card', mode === 'card');
    if (!S.nbImg[key(page)]) box.innerHTML = '<div class="ld">Turning the page…</div>';
    const want = key(page);
    try {
      const url = await fetchImg(page);
      if (key(S.nbPos) !== want || S.nbPosMode !== mode || !$('#nbPage')) return;
      box.innerHTML = `<img src="${url}" alt="${esc([l1, l2].filter(Boolean).join(': '))}">`;
      box.scrollTop = 0;
      [page + 1, page - 1].forEach(q => { if (q >= 1 && q <= max()) fetchImg(q).catch(() => {}); });
    } catch (e) { box.innerHTML = `<div class="ld">${esc(e.message)}</div>`; }
  };
  const goEntry = id => show(posOf(id));
  const setMode = m => {
    if (m === mode || (m === 'card' && !info.cards)) return;
    const pos = mode === 'card' ? toPage(page) : toCard(page);
    mode = S.nbMode = m; try { localStorage.setItem('nbMode', m); } catch (e) {}
    $('#nbMode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
    $('#nbPage').classList.remove('zoom');
    show(pos);
  };
  if (info.cards && info.installed) {
    $('#nbMode').hidden = false;
    $('#nbMode').querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.m === mode)); b.onclick = () => setMode(b.dataset.m); });
  }
  [['nbPrev', -1], ['nbPrev2', -1], ['nbNext', 1], ['nbNext2', 1]].forEach(([id, d]) => $('#' + id).onclick = () => show(page + d));
  $('#nbZoom').onclick = () => $('#nbPage').classList.toggle('zoom');
  let tx = null;
  $('#nbPage').addEventListener('touchstart', e => { tx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  $('#nbPage').addEventListener('touchend', e => {
    if (tx === null || $('#nbPage').classList.contains('zoom')) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 60) show(page + (dx < 0 ? 1 : -1));
  });
  document.onkeydown = e => { if (S.view !== 'nb' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') show(page + 1); if (e.key === 'ArrowLeft') show(page - 1); };

  const claim = async id => {
    pill('Saving…', '', 0);
    try {
      info.mine = await run('nbClaim', AUTH, id);
      Object.keys(info.claimed).forEach(k => { if (info.claimed[k] === 'me') delete info.claimed[k]; });
      info.claimed[id] = 'me'; S.data.person.nb = id;
      pill('Linked ✓ Welcome back to 1993!', 'ok', 3000); drawMe(); drawRes(); drawMiss(); goEntry(id);
    } catch (e) { pill(e.message, 'err', 6000); }
  };
  const thumb = (id, el) => { if (!byId[id] || !byId[id][3]) return; run('nbPhoto', AUTH, id).then(u => { if (u && el) el.outerHTML = `<img src="${u}" alt="">`; }, () => {}); };
  const drawMe = () => {
    const el = $('#nbMe'); if (!el) return;
    const me = mineE();
    if (me) {
      el.innerHTML = `<div class="nbme"><h4>📖 That's you: ${esc(nbName(me[2]))} (page ${me[1]})</h4>
        <div class="row" style="gap:8px"><button class="btn" id="nbGoMe" type="button">Go to my page</button>
        ${me[3] && !C.LOCKED ? `<button class="btn ghost" id="nbUse" type="button">Use my 1993 photo in Book One</button>` : ''}</div>
        <button class="linkbtn" id="nbNotMe" type="button" style="margin-top:8px;color:var(--muted)">That's not me</button></div>`;
      $('#nbGoMe').onclick = () => goEntry(me[0]);
      const u = $('#nbUse'); if (u) u.onclick = async () => {
        u.disabled = true; pill('Copying your 1993 photo…', '', 0);
        try { const r = await run('nbUseThenPhoto', AUTH); S.data.bookone.photoThen = r.id; S.data.bookone.approved = ''; pill('Done ✓ It is now your “Then” photo in Book One', 'ok', 3500); }
        catch (e) { pill(e.message, 'err', 5000); } u.disabled = false;
      };
      $('#nbNotMe').onclick = async () => { try { info.mine = await run('nbUnclaim', AUTH); Object.keys(info.claimed).forEach(k => { if (info.claimed[k] === 'me') delete info.claimed[k]; }); S.data.person.nb = ''; drawMe(); drawRes(); drawMiss(); } catch (e) { pill(e.message, 'err', 5000); } };
      return;
    }
    const p = S.data.person;
    const toks = (p.name + ' ' + p.college).toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(t => t.length >= 3 && t !== 'dr');
    const cands = info.index.filter(e => info.claimed[e[0]] !== 1).map(e => {
      const words = e[2].toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean);
      let sc = 0; toks.forEach(t => { if (t === nbFirst(e[2])) sc += 3; else if (words.includes(t)) sc += 1; });
      return [sc, e];
    }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 4).map(x => x[1]);
    el.innerHTML = `<div class="nbme"><h4>Which one is you?</h4>
      <p class="hint" style="margin:0;color:var(--muted);font-size:15px">${cands.length ? 'Is one of these you? Tap “This is me” so friends can find you.' : 'Search for your name below and tap “This is me” on your entry.'}</p>
      <div class="nbcands">${cands.map(e => `<div class="nbcand"><span class="ph" data-th="${e[0]}"></span><b>${esc(nbName(e[2]))}<br><span class="pg" style="font-weight:400;font-size:14px;color:var(--muted)">Page ${e[1]}</span></b>
        <button class="btn ghost" data-see="${e[0]}" type="button">See</button><button class="btn" data-claim="${e[0]}" type="button">This is me</button></div>`).join('')}</div></div>`;
    el.querySelectorAll('[data-th]').forEach(x => thumb(x.dataset.th, x));
    el.querySelectorAll('[data-see]').forEach(b => b.onclick = () => goEntry(b.dataset.see));
    el.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => claim(b.dataset.claim));
  };
  const drawRes = () => {
    const q = ($('#nbQ').value || '').trim().toLowerCase(), el = $('#nbRes');
    if (q.length < 2) { el.innerHTML = ''; return; }
    const hits = info.index.filter(e => e[2].toLowerCase().replace(/\./g, '').includes(q.replace(/\./g, ''))).slice(0, 12);
    el.innerHTML = hits.length ? hits.map(e => `<button class="r" type="button" data-pg="${e[0]}"><span>${esc(nbName(e[2]))}${info.claimed[e[0]] ? '<span class="tag">✓ joined</span>' : ''}</span>
      <span class="pg">Page ${e[1]} ›${!info.mine && !info.claimed[e[0]] ? ` · <a href="#" data-claim="${e[0]}">This is me</a>` : ''}</span></button>`).join('')
      : '<p class="sub" style="margin:4px 0">No one by that name. Try just the first name.</p>';
    el.querySelectorAll('[data-pg]').forEach(b => b.onclick = ev => { if (ev.target.dataset.claim) { ev.preventDefault(); return claim(ev.target.dataset.claim); } goEntry(b.dataset.pg); $('#nbPage').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  };
  const drawMiss = () => {
    const miss = info.index.filter(e => !info.claimed[e[0]]);
    $('#nbMissN').textContent = `${info.index.length - miss.length} of ${info.index.length} classmates have joined. If you're in touch with anyone below, please send them mmc1987.com.`;
    $('#nbMiss').innerHTML = miss.map(e => esc(nbName(e[2]))).join(' · ');
  };
  $('#nbQ').oninput = drawRes;
  drawMe(); drawMiss(); show(page);
}

/* ---------- autosave for Book One + Travel ---------- */
function bindInputs() {
  document.querySelectorAll('#app [data-sec="bookone"], #app [data-sec="travel"]').forEach(el => {
    const sec = el.dataset.sec, f = el.dataset.f;
    if (el.tagName === 'BUTTON') {
      el.onclick = () => {
        if (C.LOCKED && sec === 'bookone') return;
        secData(sec)[f] = el.dataset.v;
        el.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === el)));
        saveSoon(sec, 300);
      };
    } else if (el.type === 'checkbox') {
      el.onchange = () => { secData(sec)[f] = el.checked ? 'Yes' : 'No'; saveSoon(sec, 300); };
    } else {
      el.oninput = () => {
        secData(sec)[f] = el.value;
        const q = el.closest('.q'); if (q && q.classList.contains('need') && el.value.trim()) q.classList.remove('need');
        const c = document.querySelector(`[data-count="${sec}.${f}"]`);
        if (c) { const n = words(el.value), lim = +c.dataset.limit; c.textContent = `${n} / ${lim} words`; c.classList.toggle('over', n > lim); }
        saveSoon(sec, 1300);
      };
      if (C.LOCKED && sec === 'bookone') el.readOnly = true;
    }
  });
}
function secData(sec) { if (sec === 'travel') { const h = hub(); return h.travel || (h.travel = {}); } return S.data[sec]; }
function saveSoon(sec, ms) { S.saving[sec] = true; debounce('sec' + sec, () => saveNow(sec), ms); }
async function saveNow(sec) {
  if (!S.saving[sec] || (C.LOCKED && sec === 'bookone')) return;
  S.saving[sec] = false;
  const d = Object.assign({}, secData(sec));
  pill('Saving…', '', 0);
  try {
    await run('saveSection', AUTH, sec, d);
    if (sec === 'bookone' && S.data.bookone.approved === 'Yes') {
      S.data.bookone.approved = '';
      const n = document.querySelector('.ok-note'); if (n) n.textContent = 'You changed your page, so please approve it again when you’re happy with it.';
    }
    pill('Saved ✓', 'ok');
  } catch (e) { S.saving[sec] = true; pill('Not saved. Check your connection. ' + e.message, 'err', 6000); }
}
function flushAll() { ['bookone', 'travel'].forEach(s => { if (S.saving[s]) { clearTimeout(S.timers['sec' + s]); saveNow(s); } }); }
function debounce(k, fn, ms) { clearTimeout(S.timers[k]); S.timers[k] = setTimeout(fn, ms); }
window.addEventListener('beforeunload', e => { if (S.saving.bookone || S.saving.travel) { flushAll(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

/* ---------- uploads ---------- */
let Q = Promise.resolve();
function queue(fn) { Q = Q.then(fn, fn); return Q; }
function upload(file, kind, slot) {
  return new Promise((ok, bad) => {
    if (file.size > C.MAX_UPLOAD_MB * 1024 * 1024) return bad(new Error(`“${file.name}” is larger than ${C.MAX_UPLOAD_MB} MB. Please send it to your class rep instead.`));
    const r = new FileReader();
    r.onerror = () => bad(new Error('Could not read that file.'));
    r.onload = () => {
      const data = String(r.result).split(',')[1] || '';
      run('uploadFile', AUTH, kind, { name: file.name, mime: file.type, data }, slot || '').then(ok, bad);
    };
    r.readAsDataURL(file);
  });
}
function toDataUrl(file, max) {
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => ok('');
    img.src = URL.createObjectURL(file);
  });
}
async function loadThumbs(ids, done) {
  ids = ids.filter(id => id && !S.thumbs[id]);
  for (let i = 0; i < ids.length; i += 6) {
    const batch = ids.slice(i, i + 6);
    try { Object.assign(S.thumbs, await run('getThumbs', AUTH, batch, 500)); done && done(batch); } catch (e) { }
  }
}

/* ---------- start ---------- */
(async function start() {
  if (BOOT.mode === 'portal') return step1Done() ? (step2Done() ? home() : open('poll')) : openStep1();
  if (BOOT.mode === 'locked') return startLocked();
  // public page: reopen automatically if this phone was remembered
  const k = LS.get('n27key'), dev = k && LS.get('n27dev_' + k);
  if (k && dev) {
    $('#app').innerHTML = topbar() + `<div class="wrap"><p class="sub" style="text-align:center;margin-top:60px">Opening your page…</p></div>`;
    try { const r = await run('resume', k, dev); if (r) { r.key = k; KEY = k; return signedIn(r, true), LS.set('n27dev_' + k, dev); } } catch (e) { }
    LS.set('n27dev_' + k, null);
  }
  landing();
})();
</script>
<script>
window.__API = 'https://script.google.com/macros/s/AKfycbxP5EPv1Qk-niCQM-MseLTPfffqkik46j_Z-YLcjJNzZVezrz9NqKVlUdpySKfD6SxK/exec';
(function () {
  var q = new URLSearchParams(location.search), p = new URLSearchParams({ api: 'boot' });
  if (q.get('k')) p.set('k', q.get('k'));
  if (q.get('r')) p.set('r', q.get('r'));
  function start(boot) {
    window.__BOOT = boot;
    var w = document.getElementById('boot-wait'); if (w) w.remove();
    var s = document.createElement('script');
    s.text = document.getElementById('main').textContent;
    document.body.appendChild(s);
  }
  function load(n) {
    fetch(window.__API + '?' + p.toString())
      .then(function (r) { return r.json(); })
      .then(start)
      .catch(function () {
        if (n < 2) return setTimeout(function () { load(n + 1); }, 1500);
        document.getElementById('boot-wait').innerHTML = 'Could not reach the server. <a href="">Try again</a>';
      });
  }
  load(0);
})();
</script>
